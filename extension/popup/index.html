<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Epirus Shield</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #ffffff;
      color: #222222;
    }

    .header {
      background: #243B72;
      color: white;
      padding: 16px;
    }

    .header h1 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .header p {
      font-size: 12px;
      opacity: 0.8;
    }

    .content {
      padding: 16px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      background: rgba(0, 138, 5, 0.1);
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .status-icon {
      width: 24px;
      height: 24px;
      color: #008a05;
    }

    .status-text {
      font-size: 13px;
      font-weight: 500;
      color: #008a05;
    }

    .domains-title {
      font-size: 12px;
      font-weight: 600;
      color: #717171;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .domains-list {
      list-style: none;
    }

    .domains-list li {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid #ebebeb;
      font-size: 13px;
    }

    .domains-list li:last-child {
      border-bottom: none;
    }

    .domain-icon {
      width: 16px;
      height: 16px;
      color: #243B72;
    }

    .footer {
      padding: 12px 16px;
      background: #f7f7f7;
      font-size: 11px;
      color: #717171;
      text-align: center;
    }

    .footer a {
      color: #243B72;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Epirus Shield</h1>
    <p>Προστασία από phishing emails</p>
  </div>

  <div class="content">
    <div class="status">
      <svg class="status-icon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12.516 2.17a.75.75 0 00-1.032 0 11.209 11.209 0 01-7.877 3.08.75.75 0 00-.722.515A12.74 12.74 0 002.25 9.75c0 5.942 4.064 10.933 9.563 12.348a.749.749 0 00.374 0c5.499-1.415 9.563-6.406 9.563-12.348 0-1.39-.223-2.73-.635-3.985a.75.75 0 00-.722-.516l-.143.001c-2.996 0-5.717-1.17-7.734-3.08zm3.094 8.016a.75.75 0 10-1.22-.872l-3.236 4.53L9.53 12.22a.75.75 0 00-1.06 1.06l2.25 2.25a.75.75 0 001.14-.094l3.75-5.25z"/>
      </svg>
      <span class="status-text">Ενεργή προστασία</span>
    </div>

    <div class="domains-title">Επαληθευμένα domains</div>
    <ul class="domains-list" id="domains-list">
      <li>
        <svg class="domain-icon" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M16.704 4.153a.75.75 0 01.143 1.052l-8 10.5a.75.75 0 01-1.127.075l-4.5-4.5a.75.75 0 011.06-1.06l3.894 3.893 7.48-9.817a.75.75 0 011.05-.143z" clip-rule="evenodd"/>
        </svg>
        <span>epirusbank.gr</span>
      </li>
      <li>
        <svg class="domain-icon" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M16.704 4.153a.75.75 0 01.143 1.052l-8 10.5a.75.75 0 01-1.127.075l-4.5-4.5a.75.75 0 011.06-1.06l3.894 3.893 7.48-9.817a.75.75 0 011.05-.143z" clip-rule="evenodd"/>
        </svg>
        <span>epirus-bank.gr</span>
      </li>
    </ul>
  </div>

  <div class="footer">
    <a href="https://epirusbank.gr" target="_blank">epirusbank.gr</a> · Epirus Bank
  </div>

  <script src="popup.js"></script>
</body>
</html>
